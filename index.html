<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://use.typekit.net/knf2zgc.css">
    <title>Ephemeral</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000;
        }

        body {
            font-family: "sloop-script-three", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: #fff;
            overflow-x: hidden;
        }

        /* ── Background video ────────────────────────────────────────────── */
        #bg-video {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #bg-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.05);
        }

        /* ── SVG logo ────────────────────────────────────────────────────── */
        #svg-logo {
            position: fixed;
            z-index: 10;
            will-change: width, top, left;
        }

        /* ── Top nav ─────────────────────────────────────────────────────── */
        #top-nav {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            display: flex;
            gap: 3rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .nav-btn {
            font-family: "sloop-script-three", sans-serif;
            font-weight: 500;
            color: #000;
            font-size: 2.3rem;
            text-decoration: none;
            cursor: pointer;
            -webkit-text-stroke: 0.2px #fff;
            transition: opacity 0.3s ease;
        }

        .nav-btn:hover {
            -webkit-text-stroke: 1px #fff;
        }

        /* ── Scroll spacer (home only) ───────────────────────────────────── */
        #scroll-spacer {
            height: 300vh;
        }

        /* ── Product section (home) ──────────────────────────────────────── */
        #product-section {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            padding-top: 30px;
        }

        .img-perspective {
            perspective: 1400px;
        }

        #ephemeral-img {
            display: block;
            width: clamp(180px, 32vw, 420px);
            animation: spinY 6s linear infinite;
            will-change: transform;
        }

        @keyframes spinY {
            from {
                transform: rotateY(0deg);
            }

            to {
                transform: rotateY(360deg);
            }
        }

        .purchase-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 14px 56px;
            color: #000;
            font-size: 5rem;
            text-decoration: none;
            font-family: inherit;
            background: transparent;
            cursor: pointer;
            -webkit-text-stroke: 0.5px #fff;
            transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        .purchase-btn:hover {
            -webkit-text-stroke: 1px #fff;
            border-color: transparent;
        }

        /* ── Shop view ───────────────────────────────────────────────────── */
        #view-shop {
            display: none;
            position: relative;
            inset: 0;
            z-index: 5;
            overflow-y: auto;
        }

        #view-shop.active {
            display: block;
        }

        /* Mobile-first: stacked column */
        #shop-inner {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(130px, 16vh, 170px) 0 3vh;
        }

        #product-photo {
            display: block;
            width: 62vw;
            max-width: 400px;
            min-width: 160px;
            max-height: 40vh;
            object-fit: contain;
        }

        #shop-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5vh;
            padding: 0 6% 2vh;
            width: 100%;
            margin-top: 2vh;
        }

        .size-label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 60%;
        }

        .shop-price {
            font-family: "sloop-script-three", sans-serif;
            font-size: clamp(3rem, 6.5vw, 5.5rem);
            color: #fff;
            -webkit-text-stroke: 0.5px #000;
            text-shadow: 0 0 28px rgba(0, 0, 0, 0.95), 0 2px 12px rgba(0, 0, 0, 0.85);
            line-height: 1;
        }

        .size-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(0.3rem, 0.8vw, 0.7rem);
            width: 100%;
            max-width: 320px;
        }

        .size-label {
            font-family: "sloop-script-three", sans-serif;
            font-size: clamp(2rem, 4vw, 4rem);
            color: #fff;
            -webkit-text-stroke: 0.5px #000;
            text-shadow: 0 0 28px rgba(0, 0, 0, 0.95), 0 2px 12px rgba(0, 0, 0, 0.85);
            line-height: 1;
        }

        .size-options {
            display: flex;
            gap: 1.5vw;
            flex-wrap: nowrap;
            justify-content: center;
            min-width: 0;
        }

        .size-btn {
            font-family: "sloop-script-three", sans-serif;
            font-size: clamp(1rem, 3vw, 2.8rem);
            color: #000;
            background: rgba(255, 255, 255, 0.5);
            border: 1.5px solid rgba(0, 0, 0);
            padding: 0.35em 0.9em;
            cursor: pointer;
            -webkit-text-stroke: 0.2px #000;
            transition: border-color 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .size-btn:hover {
            border-color: #fff;
        }

        .size-btn.selected {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
        }

        .buy-btn {
            display: inline-block;
            font-family: "sloop-script-three", sans-serif;
            font-size: clamp(1.2rem, 5vw, 4rem);
            color: #000;
            background: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            cursor: pointer;
            -webkit-text-stroke: 0.4px #000;
            padding: 0.25em 0.9em;
            border: 1.5px solid rgba(0, 0, 0);
            transition: border-color 0.2s, background 0.2s;
            white-space: nowrap;
        }

        .buy-btn:hover {
            background: rgba(255, 255, 255, 0.85);
            border-color: #fff;
        }

        /* ── Shop: two-column layout on larger screens ───────────────────── */
        @media (min-width: 769px) {
            #shop-inner {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: stretch;
                padding: 0;
            }

            #product-photo {
                width: 100%;
                max-width: none;
                min-width: 0;
                height: 100vh;
                max-height: 100vh;
                padding: clamp(90px, 13vh, 140px) 2% 5% 7%;
            }

            #shop-details {
                align-items: flex-end;
                justify-content: center;
                gap: 3vh;
                padding: 0 8% 0 4%;
                margin-top: 0;
            }

            .size-selector {
                align-items: flex-end;
                max-width: none;
                width: 100%;
            }

            .size-options {
                justify-content: flex-end;
                gap: 1vw;
            }
        }

        /* ── Gallery view ────────────────────────────────────────────────── */
        #view-gallery {
            display: none;
            position: relative;
            z-index: 5;
        }

        #view-gallery.active {
            display: block;
        }

        #gallery-section {
            position: relative;
            z-index: 5;
            padding: 210px 40px 80px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            cursor: pointer;
            overflow: hidden;
            aspect-ratio: 1;
            background: transparent;
            margin-bottom: 3rem;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: transform 0.35s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.06);
        }

        @media (max-width: 960px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ── Lightbox ────────────────────────────────────────────────────── */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        #lightbox-img {
            max-width: 88vw;
            max-height: 88vh;
            object-fit: contain;
            display: block;
            transition: opacity 0.15s ease;
        }

        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 28px;
            font-size: 2.8rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
            font-family: sans-serif;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        #lightbox-close:hover {
            opacity: 1;
        }

        #lightbox-prev,
        #lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3.5rem;
            color: #fff;
            cursor: pointer;
            background: none;
            border: none;
            padding: 16px 24px;
            font-family: sans-serif;
            user-select: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        #lightbox-prev:hover,
        #lightbox-next:hover {
            opacity: 1;
        }

        #lightbox-prev {
            left: 12px;
        }

        #lightbox-next {
            right: 12px;
        }

        @media (max-width: 768px) {

            /* ── Nav ── */
            #top-nav {
                top: 80px;
                gap: 1.2rem;
                width: 100%;
                justify-content: center;
            }

            .nav-btn {
                font-size: 2rem;
                white-space: nowrap;
            }

            .purchase-btn {
                font-size: 3rem;
                padding: 10px 32px;
            }

            #ephemeral-img {
                width: clamp(180px, 72vw, 300px);
            }

            /* ── Shop view ── */
            #shop-inner {
                padding-top: clamp(120px, 15vh, 155px);
                justify-content: flex-end;
            }

            #product-photo {
                width: 60vw;
                max-height: 36vh;
            }

            #shop-details {
                gap: 1.2vh;
                padding: 0 6% 2vh;
            }

            .size-options {
                gap: 3vw;
            }

            .size-btn {
                font-size: 2rem;
                padding: 0.4em 1em;
            }

            /* ── Gallery ── */
            #gallery-section {
                padding: 150px 16px 60px;
            }

            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .size-label-row {
                width: 80%;
            }
        }

        @media (max-width: 500px) {
            #shop-inner {
                padding-top: clamp(115px, 14vh, 140px);
            }

            #product-photo {
                width: 75vw;
                max-height: 30vh;
            }

            .shop-price {
                font-size: clamp(2.2rem, 8vw, 3rem);
            }

            .size-label {
                   font-size: clamp(2.2rem, 8vw, 3rem);
            }

            .size-btn {
                font-size: clamp(1.5rem, 7vw, 2.5rem);
                padding: 0.4em 0.9em;
            }

            #gallery-section {
                padding: 135px 12px 60px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Background video — loads once, plays uninterrupted across all views -->
    <div id="bg-video">
        <video autoplay muted loop playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <!-- SVG logo — click returns to home from any view -->
    <img id="svg-logo" src="Ephemera-Black-cropped.svg" alt="Ephemeral">

    <!-- Nav -->
    <div id="top-nav">
        <a class="nav-btn" data-view="shop">Shop</a>
        <a class="nav-btn" data-view="gallery">1 of 1 Boards</a>
    </div>

    <!-- Home: scroll spacer drives the logo animation -->
    <div id="scroll-spacer"></div>

    <!-- Home: product section -->
    <section id="product-section">
        <div class="img-perspective">
            <img id="ephemeral-img" src="product/Ephemeral%20Product%20Shot%20PNG.png" alt="Ephemeral">
        </div>
        <a class="purchase-btn" data-view="shop">Purchase</a>
    </section>

    <!-- Shop view -->
    <div id="view-shop">
        <div id="shop-inner">
            <img id="product-photo" src="product/Ephemeral%20Product%20Shot%20PNG.png" alt="Ephemeral Skateboard">
            <div id="shop-details">

                <div class="size-selector">
                    <div class="size-label-row">
                        <p class="shop-price">$50</p>
                        <p class="size-label">size</p>
                    </div>
                    <div class="size-options">
                        <button class="size-btn" data-size="8.0">8.0"</button>
                        <button class="size-btn" data-size="8.25">8.25"</button>
                        <button class="size-btn" data-size="8.5">8.5"</button>
                    </div>
                </div>
                <a class="buy-btn" id="buy-btn" href="#" target="_blank">buy now</a>
            </div>
        </div>
    </div>

    <!-- Gallery view -->
    <div id="view-gallery">
        <section id="gallery-section">
            <div class="gallery-grid" id="gallery-grid"></div>
        </section>
    </div>

    <!-- Lightbox -->
    <div id="lightbox">
        <button id="lightbox-close">&#215;</button>
        <button id="lightbox-prev">&#8249;</button>
        <img id="lightbox-img" src="" alt="">
        <button id="lightbox-next">&#8250;</button>
    </div>

    <script>
        // ── Elements ──────────────────────────────────────────────────────────
        const svgLogo = document.getElementById('svg-logo');
        const productSection = document.getElementById('product-section');
        const topNav = document.getElementById('top-nav');
        const scrollSpacer = document.getElementById('scroll-spacer');
        const viewShop = document.getElementById('view-shop');
        const viewGallery = document.getElementById('view-gallery');

        let SVG_ASPECT = null;
        let currentView = 'home';

        // ── Easing helpers ────────────────────────────────────────────────────
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
        function lerp(a, b, t) { return a + (b - a) * t; }

        // ── Logo: fixed at top (shop / gallery) ───────────────────────────────
        function positionLogoFixed() {
            const vw = window.innerWidth;
            const finalWidth = vw < 768 ? vw * 0.45 : vw * 0.2;
            svgLogo.style.width = finalWidth + 'px';
            svgLogo.style.left = ((vw - finalWidth) / 2) + 'px';
            svgLogo.style.top = '20px';
        }

        // ── Home scroll animation ─────────────────────────────────────────────
        function update() {
            if (currentView !== 'home' || SVG_ASPECT === null) return;

            const scrollY = window.scrollY;
            const vh = window.innerHeight;
            const vw = window.innerWidth;

            const phase1Raw = clamp(scrollY / vh, 0, 1);
            const phase1 = easeInOutCubic(phase1Raw);
            const phase2 = clamp((scrollY - vh) / (vh * 0.5), 0, 1);

            // SVG sizing
            const initialWidth = vw * 0.8;
            const initialHeight = initialWidth * SVG_ASPECT;
            const finalWidth = vw < 768 ? vw * 0.45 : vw * 0.2;
            const svgWidth = lerp(initialWidth, finalWidth, phase1);

            // SVG position — clamp initialTop so it never starts above 20px,
            // and clamp the final value so it never goes above the resting position (20px).
            const LOGO_TOP = 20;
            const initialTop = Math.max((vh - initialHeight) / 2, LOGO_TOP);
            const svgTop = clamp(lerp(initialTop, LOGO_TOP, phase1), LOGO_TOP, initialTop);

            const svgLeft = (vw - svgWidth) / 2;

            svgLogo.style.width = svgWidth + 'px';
            svgLogo.style.left = svgLeft + 'px';
            svgLogo.style.top = svgTop + 'px';

            // Product section
            productSection.style.opacity = phase2;
            productSection.style.pointerEvents = phase2 > 0.05 ? 'all' : 'none';

            // Nav
            const navReady = phase1 > 0.95;
            topNav.style.opacity = navReady ? 1 : 0;
            topNav.style.pointerEvents = navReady ? 'all' : 'none';
        }

        // ── View switching ────────────────────────────────────────────────────
        function switchView(view) {
            currentView = view;

            scrollSpacer.style.display = 'none';
            productSection.style.opacity = '0';
            productSection.style.pointerEvents = 'none';
            viewShop.classList.remove('active');
            viewGallery.classList.remove('active');
            document.body.style.overflow = 'hidden';

            if (view === 'home') {
                svgLogo.style.position = 'fixed';
                topNav.style.position = 'fixed';
                svgLogo.style.pointerEvents = 'none';
                svgLogo.style.cursor = 'default';
                scrollSpacer.style.display = '';
                document.body.style.overflow = '';
                window.scrollTo(0, 0);
                update();
            } else if (view === 'shop') {
                viewShop.classList.add('active');
                document.body.style.overflow = '';
                window.scrollTo(0, 0);

                svgLogo.style.position = 'absolute';
                topNav.style.position = 'absolute';
                svgLogo.style.pointerEvents = 'all';
                svgLogo.style.cursor = 'pointer';
                positionLogoFixed();
                topNav.style.opacity = '1';
                topNav.style.pointerEvents = 'all';
            } else if (view === 'gallery') {
                viewGallery.classList.add('active');
                document.body.style.overflow = '';
                window.scrollTo(0, 0);

                svgLogo.style.position = 'absolute';
                topNav.style.position = 'absolute';
                svgLogo.style.pointerEvents = 'all';
                svgLogo.style.cursor = 'pointer';
                positionLogoFixed();
                topNav.style.opacity = '1';
                topNav.style.pointerEvents = 'all';
            }
        }

        // ── Nav + purchase button click handlers ──────────────────────────────
        document.querySelectorAll('[data-view]').forEach(el => {
            el.addEventListener('click', e => {
                e.preventDefault();
                switchView(el.dataset.view);
            });
        });

        // ── Gallery data & grid ───────────────────────────────────────────────
        const photos = [
            { src: 'gallery%20boards/Advent.png', label: 'advent' },
            { src: 'gallery%20boards/be%20a%20narc.png', label: 'be a narc' },
            { src: 'gallery%20boards/big%20guy.png', label: 'big guy' },
            { src: 'gallery%20boards/catropic%20tristesse.png', label: 'catropic tresstese' },
            { src: 'gallery%20boards/century.png', label: 'century' },
            { src: 'gallery%20boards/down%20n_%20out.png', label: "down n' out" },
            { src: 'gallery%20boards/eyes.png', label: 'eyes' },
            { src: 'gallery%20boards/in%20reflection.png', label: 'in reflection' },
            { src: 'gallery%20boards/in%20stone.png', label: 'in stone' },
            { src: 'gallery%20boards/its%20our%20fault.png', label: "it's our fault" },
            { src: 'gallery%20boards/kate.png', label: 'kate' },
            { src: 'gallery%20boards/leather.png', label: 'leather' },
            { src: 'gallery%20boards/lord%20have%20mercy.png', label: 'lord have merthy' },
            { src: 'gallery%20boards/memories.png', label: 'memories' },
            { src: 'gallery%20boards/nodus%20tollens.png', label: 'nodus tollens' },
            { src: 'gallery%20boards/nothing_s%20easy.png', label: "nothing's easy" },
            { src: 'gallery%20boards/one%20eye%20open.png', label: 'one eye open' },
            { src: 'gallery%20boards/riley.png', label: 'riley' },
            { src: 'gallery%20boards/self%20portrait.png', label: 'self portrait' },
            { src: 'gallery%20boards/smile.png', label: 'smile' },
            { src: 'gallery%20boards/two%20towers.png', label: 'two towers' },
            { src: 'ephemeral.png', label: 'ephemeral' },
        ];

        const grid = document.getElementById('gallery-grid');
        photos.forEach((photo, i) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.dataset.index = i;
            const img = document.createElement('img');
            img.src = photo.src;
            img.alt = photo.label;
            img.loading = 'lazy';
            item.appendChild(img);
            grid.appendChild(item);
        });

        // ── Lightbox ──────────────────────────────────────────────────────────
        let currentIndex = 0;
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = photos[index].src;
            lightboxImg.alt = photos[index].label;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function showPhoto(index) {
            currentIndex = (index + photos.length) % photos.length;
            lightboxImg.style.opacity = '0';
            setTimeout(() => {
                lightboxImg.src = photos[currentIndex].src;
                lightboxImg.alt = photos[currentIndex].label;
                lightboxImg.style.opacity = '1';
            }, 120);
        }

        grid.addEventListener('click', e => {
            const item = e.target.closest('.gallery-item');
            if (item) openLightbox(+item.dataset.index);
        });

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', e => {
            if (e.target === lightbox) closeLightbox();
        });

        document.getElementById('lightbox-prev').addEventListener('click', e => {
            e.stopPropagation();
            showPhoto(currentIndex - 1);
        });

        document.getElementById('lightbox-next').addEventListener('click', e => {
            e.stopPropagation();
            showPhoto(currentIndex + 1);
        });

        document.addEventListener('keydown', e => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') showPhoto(currentIndex - 1);
            if (e.key === 'ArrowRight') showPhoto(currentIndex + 1);
        });

        svgLogo.addEventListener('click', () => {
            if (currentView !== 'home') switchView('home');
        });

        // ── Shop: size selection ──────────────────────────────────────────────
        const sizeBtns = document.querySelectorAll('.size-btn');
        const buyBtn = document.getElementById('buy-btn');

        // Stripe links — replace these placeholders with real links
        const stripeLinks = {
            '8.0': 'https://buy.stripe.com/eVq5kD6pyaej2LM9QBao801',
            '8.25': 'https://buy.stripe.com/7sY5kDaFOcmr5XYfaVao803', 
            '8.5': 'https://buy.stripe.com/4gM7sLbJSdqvdqq8Mxao802',  
        };

        sizeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sizeBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                buyBtn.href = stripeLinks[btn.dataset.size] || '#';
            });
        });

        // ── Init ──────────────────────────────────────────────────────────────
        function initAspect() {
            SVG_ASPECT = svgLogo.naturalHeight / svgLogo.naturalWidth;
            update();
        }
        if (svgLogo.complete && svgLogo.naturalWidth) {
            initAspect();
        } else {
            svgLogo.addEventListener('load', initAspect);
        }
        window.addEventListener('scroll', update, { passive: true });
        window.addEventListener('resize', () => {
            if (currentView === 'home') update();
            else positionLogoFixed();
        }, { passive: true });
    </script>

</body>
